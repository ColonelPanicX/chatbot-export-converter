[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-export-converter"
version = "0.1.0"
description = "Convert ChatGPT and Claude data exports into browsable per-conversation markdown folders"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "questionary>=2.1.1",
]

[project.scripts]
chatbot-convert = "chatbot_export_converter.converter:main"

[dependency-groups]
dev = [
    "black>=24.0",
    "mypy>=1.9",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
