[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-export-converter"
version = "0.1.0"
description = "Convert a ChatGPT data export into browsable per-conversation markdown folders"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

[project.scripts]
chatgpt-convert = "chatgpt_export_converter.converter:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
